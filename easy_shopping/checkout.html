<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Checkout</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar is added here by navbar.js -->
  <div id="navbar"></div>

  <main class="container">

    <!-- Form to collect customer delivery information -->
    <form class="form-box" onsubmit="placeOrder(event)">

      <h1>Checkout</h1>

      <!-- Display the total amount of the order -->
      <p>Your order total: <b id="checkoutTotal">Rs. 0</b></p>

      <!-- Customer phone number -->
      <label>Phone number</label>
      <input id="phone" required>

      <!-- Customer city -->
      <label>City</label>
      <input id="city" required>

      <!-- Customer delivery address -->
      <label>Delivery address</label>
      <textarea id="address" rows="3" required></textarea>

      <!-- Submit the order -->
      <button type="submit">Place order</button>
    </form>

  </main>

  <!-- Footer is added here by navbar.js -->
  <div id="footer"></div>

  <!-- Load the navbar and footer functions -->
  <script src="navbar.js"></script>

  <!-- Load the login and cart helper functions -->
  <script src="auth.js"></script>

  <!-- Load the checkout functions -->
  <script src="checkout.js"></script>
</body>
</html>
